[package]
name = "moat"
version = "0.1.0"
edition = "2024"
description = "Homelab security posture scanner — know what's exposed before someone else does"
license = "MIT"
repository = "https://github.com/Vericious/moat"
readme = "README.md"
keywords = ["docker", "security", "homelab", "scanner", "selfhosted"]
categories = ["command-line-utilities"]

[dependencies]
bollard = "0.18"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
colored = "3"
regex = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
